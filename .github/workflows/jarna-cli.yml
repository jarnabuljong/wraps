name: Jarna CLI checks

# Fork-only. Upstream's Test workflow skips every job outside
# wraps-team/wraps (`if: github.repository == ...`) and needs secrets this
# fork doesn't have, so fork pull requests had no checks at all. This runs the
# secret-free subset: the CLI's type check and tests, the architecture tests
# and baseline scan, and the linter. Leave it out of upstream pull requests.

on:
  pull_request:
  push:
    branches: ["jarna/**"]

permissions:
  contents: read

concurrency:
  group: jarna-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm --filter "@wraps.dev/cli^..." build

      - name: Type check
        run: pnpm --dir packages/cli typecheck

      - name: CLI tests
        run: pnpm --dir packages/cli test

      - name: Architecture tests
        run: pnpm test:architecture

      - name: Baseline (changed files)
        if: github.event_name == 'pull_request'
        run: pnpm exec baseline scan --format github --changed-only .

      - name: Lint
        run: pnpm check:errors
